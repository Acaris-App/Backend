name: Acaris - E2E Tests

on:
  workflow_dispatch:

jobs:
  api-testing:
    name: Run Node.js API E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies for tests
        working-directory: tests
        run: npm install

      - name: Execute Automated API Tests
        working-directory: tests
        run: node automated/automated_api_tests.js






