name: Acaris - CI Test

on:
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Force failure'
        required: false
        default: 'false'


permissions:
  contents: read

jobs:
  service-tests:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, consultation-service, ai-document-service]

    steps:
      - name: Force failure
        if: github.event.inputs.force_fail == 'true'
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Run lint/syntax check (if available)
        working-directory: services/${{ matrix.service }}
        run: npm run lint --if-present

      - name: Run unit tests (if available)
        working-directory: services/${{ matrix.service }}
        run: npm test --if-present

  health-smoke-test:
    name: Production Health Smoke Test
    runs-on: ubuntu-latest
    needs: service-tests
    # Hanya jalankan smoke test pada branch main
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    
    steps:
      - name: Check /api/health endpoint
        run: |
          set -e
          echo "Mengecek endpoint health check API..."
          curl -k --fail --silent --show-error "https://acaris.my.id/api/health"
          echo -e "\nBerhasil terhubung ke backend Acaris!"







