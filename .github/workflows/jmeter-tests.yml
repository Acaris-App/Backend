name: JMeter Tests

on:
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Force failure'
        required: false
        default: 'false'
      target_url:
        description: Full URL to test, for example https://service-url/health
        required: false
        default: "https://acaris.my.id/api/health"
        type: string
      users:
        description: Number of virtual users
        required: true
        default: "50"
        type: string
      ramp_up:
        description: Ramp-up time in seconds
        required: true
        default: "30"
        type: string
      duration:
        description: Test duration in seconds
        required: true
        default: "60"
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  JMETER_VERSION: "5.6.3"

jobs:
  jmeter:
    name: Run JMeter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_URL: ${{ inputs.target_url }}

    steps:
      - name: Force failure
        if: github.event.inputs.force_fail == 'true'
        run: exit 1
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse target URL
        run: |
          node <<'NODE'
          const fs = require('fs');
          const url = new URL(process.env.TARGET_URL);
          const path = url.pathname === '/' ? '/health' : url.pathname;
          const lines = [
            `TARGET_PROTOCOL=${url.protocol.replace(':', '')}`,
            `TARGET_HOST=${url.hostname}`,
            `TARGET_PORT=${url.port || (url.protocol === 'https:' ? '443' : '80')}`,
            `TARGET_PATH=${path}${url.search}`
          ];
          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join('\n')}\n`);
          NODE

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JMeter
        run: |
          curl --fail --location --silent --show-error --connect-timeout 20 --max-time 180 \
            "https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" \
            --output jmeter.tgz
          tar -xzf jmeter.tgz
          echo "JMETER_HOME=$PWD/apache-jmeter-${JMETER_VERSION}" >> "$GITHUB_ENV"

      - name: Run JMeter
        run: |
          mkdir -p test-results/jmeter
          "$JMETER_HOME/bin/jmeter" \
            -n \
            -t tests/load/acaris-health-load-test.jmx \
            -l test-results/jmeter/result.jtl \
            -e \
            -o test-results/jmeter/report \
            -Jtarget_protocol="$TARGET_PROTOCOL" \
            -Jtarget_host="$TARGET_HOST" \
            -Jtarget_port="$TARGET_PORT" \
            -Jtarget_path="$TARGET_PATH" \
            -Jusers="${{ inputs.users }}" \
            -Jramp_up="${{ inputs.ramp_up }}" \
            -Jduration="${{ inputs.duration }}"

      - name: Write JMeter run summary
        if: always()
        run: |
          mkdir -p test-results/jmeter
          {
            echo "# JMeter Load Test Summary"
            echo ""
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Target URL: $TARGET_URL"
            echo "Target path: $TARGET_PATH"
            echo "Users: ${{ inputs.users }}"
            echo "Ramp-up seconds: ${{ inputs.ramp_up }}"
            echo "Duration seconds: ${{ inputs.duration }}"
            echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > test-results/jmeter/jmeter-summary.md

      - name: Upload JMeter artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-load-test
          path: test-results/jmeter/
          if-no-files-found: ignore
          retention-days: 30







